# 源码含中文注释，必须固定 UTF-8，避免 Windows 默认代码页导致乱码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 本工程零运行时依赖（不引 androidx），此项仅为消除 AGP 的默认校验噪声
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# =====================================================================================
# 【版本号（唯一显式来源，方便修改）】
#   AGP    8.13.0
#   Kotlin 2.2.21
#   注意：这两行只是**声明性注释**，Gradle 不读取它们（plugins {} 块里的字面量才是唯一生效来源）。
#   改版本时**必须同时改**（缺一即不一致）：
#     ① artifacts/android-app/build.gradle.kts 的 plugins { version "…" }
#     ② 本文件这两行（保持显式可见）
#     ③ .github/workflows/build-apk.yml 的 env.KOTLIN_VERSION / AGP_VERSION

# 【已废弃：-P 注入】旧设计用 `-PagpVersion` / `-PkotlinVersion` 传入版本，
#   但 Kotlin DSL 的 plugins {} 块只接受常量字面量，引用变量会导致脚本编译失败（见 ci-notes.md 第 0.5 节）。
#   且 Gradle 的属性优先级里 **gradle.properties > 命令行 -P**，即使写成
#   agpVersion=8.13.0 也会反过来屏蔽命令行覆盖。所以不要再在本文件里定义 agpVersion/kotlinVersion 属性。

